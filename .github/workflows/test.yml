name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"
      - run: python -m compileall -q handlers sentry_incident_ops scripts tests
      - run: python -m json.tool module.json >/dev/null
      - run: python -m unittest discover -s tests -v
